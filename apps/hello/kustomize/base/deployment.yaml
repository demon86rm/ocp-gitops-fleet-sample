# deployment.yaml
# Purpose: the web server. Port 8080, non-root, works under the restricted SCC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
    spec:
      containers:
        - name: httpd
          image: registry.access.redhat.com/ubi9/httpd-24:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - name: page
              mountPath: /var/www/html
      volumes:
        - name: page
          configMap:
            name: hello-page
