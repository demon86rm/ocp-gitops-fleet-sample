# kustomization.yaml
# Purpose: prod flavour of the hello app (replicas and page text).
resources:
  - ../../base
namePrefix: prod-
replicas:
  - name: hello
    count: 2
configMapGenerator:
  - name: hello-page
    behavior: replace
    literals:
      - 'index.html=<html><body><h1>Hello from the fleet</h1><p>environment: prod</p></body></html>'
