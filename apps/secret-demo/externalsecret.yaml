# externalsecret.yaml
# Purpose: ask the store for the value "token" of the source secret hello-api-key and create a local Secret from it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hello-api-key
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: workshop-store
  target:
    name: hello-api-key
  data:
    - secretKey: token
      remoteRef:
        key: hello-api-key
        property: token
