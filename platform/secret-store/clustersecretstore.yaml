# clustersecretstore.yaml
# Purpose: the store applications refer to by name (workshop-store).
# Provider: the Kubernetes API of this same cluster, namespace workshop-secrets-source.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: workshop-store
spec:
  provider:
    kubernetes:
      remoteNamespace: workshop-secrets-source
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: workshop-secrets-source
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-reader
          namespace: workshop-secrets-source
